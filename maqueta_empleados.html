<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PAULET - Campo y Fotovoltaico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background: #0a1224;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: hidden;
    }
    .bg-space {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(30,58,95,0.45), transparent 72%), linear-gradient(180deg, #0a1224 0%, #060d1a 100%);
    }
    .phone {
      position: relative;
      z-index: 1;
      width: 420px;
      min-width: min(420px, 100vw);
      height: 844px;
      max-width: 100%;
      border: 12px solid #060d1a;
      border-radius: 44px;
      background: #0a1224;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 25px;
      border-radius: 999px;
      background: #060d1a;
      z-index: 50;
      pointer-events: none;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    .hidden { display: none !important; }
    #login {
      background: #000;
    }
    .login-brand-panel {
      flex-shrink: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px 28px;
      position: relative;
      z-index: 2;
    }
    .login-brand-panel::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -28px;
      transform: translateX(-50%);
      width: 130%;
      height: 56px;
      background: #fff;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }
    .login-fise-logo {
      display: block;
      max-width: min(190px, 68%);
      width: 100%;
      height: auto;
      position: relative;
      z-index: 2;
    }
    .login-form-section {
      flex: 1;
      min-height: 0;
      background: linear-gradient(165deg, #1e3a5f 0%, #17233f 42%, #11172f 100%);
      padding: 40px 28px 22px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 22px;
      color: #f8fbff;
      letter-spacing: -0.02em;
    }
    .form { display: flex; flex-direction: column; gap: 14px; }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      min-height: 54px;
      overflow: hidden;
    }
    .input-icon {
      width: 48px;
      display: grid;
      place-items: center;
      color: #8fb4d8;
      flex-shrink: 0;
    }
    .input-icon svg { width: 18px; height: 18px; }
    input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 0 14px 0 0;
    }
    input::placeholder { color: #8fa3bd; }
    .eye-btn {
      width: 46px;
      height: 46px;
      border: 0;
      background: transparent;
      color: #9fb6d4;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .eye-btn svg { width: 20px; height: 20px; }
    .btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38d996, #00d68f);
      color: #061422;
      box-shadow: 0 14px 28px rgba(0,214,143,0.24);
    }
    .btn-outline {
      background: transparent;
      color: #dbeafe;
      border: 1.5px solid rgba(219,234,254,0.32);
    }
    .error {
      display: none;
      color: #fca5a5;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
      font-weight: 700;
    }
    .selector-body {
      flex: 1;
      background: linear-gradient(165deg, #1e3a5f 0%, #17233f 42%, #11172f 100%);
      padding: 72px 22px 22px;
      overflow-y: auto;
    }
    .selector-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
    .selector-copy { color: #b9c7dc; font-size: 14px; line-height: 1.45; margin-bottom: 18px; }
    .module-card {
      width: 100%;
      border: 1px solid rgba(147,197,253,0.28);
      background: rgba(15,23,42,0.62);
      color: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .module-card strong { font-size: 18px; font-weight: 900; }
    .module-card span { color: #b9c7dc; font-size: 13px; line-height: 1.35; }
    .module-frame {
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-width: 0;
      border: 0;
      display: block;
      background: #000;
    }
    .back-btn {
      position: absolute;
      top: 44px;
      left: 16px;
      z-index: 40;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(2,6,23,0.68);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }
    .back-btn svg { width: 22px; height: 22px; }
    .hint {
      margin-top: auto;
      padding-top: 14px;
      color: #9fb6d4;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
    @media (max-width: 430px) {
      html, body { padding: 0; }
      .phone { width: 100%; height: 100vh; border: 0; border-radius: 0; }
      .phone::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-space"></div>
  <main class="phone">
    <section id="login" class="screen">
      <div class="login-brand-panel">
        <img src="https://cvcenergia.com.pe/images/beneficiarios-fise/fise-logo.png" alt="FISE" class="login-fise-logo" />
      </div>
      <div class="login-form-section">
        <h1>Bienvenido</h1>
        <div class="form">
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input id="loginIdentifier" type="text" placeholder="DNI o Correo electrónico" autocomplete="username" />
          </div>
          <div class="input-wrap">
            <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input id="passwordInput" type="password" placeholder="Contraseña" />
            <button type="button" class="eye-btn" onclick="togglePassword()"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <button type="button" class="btn btn-primary" onclick="handleLogin()">Ingresar</button>
          <p id="loginError" class="error"></p>
        </div>
        <div class="hint">Demo: 44444444 Campo, 66666666 Fotovoltaico, 77777777 ambos. Clave: 123456.</div>
      </div>
    </section>

    <section id="selector" class="screen hidden">
      <div class="selector-body">
        <div class="selector-title">Hola <span id="selectorNombre">Renzo</span></div>
        <p class="selector-copy" id="selectorText">Selecciona el módulo al que deseas ingresar.</p>
        <button class="module-card" onclick="openModule('campo')"><strong>PAULET Campo</strong><span>Mapa, fotos GPS y metrados de campo.</span></button>
        <button class="module-card" onclick="openModule('fotovoltaico')"><strong>Fotovoltaico</strong><span>Supervisión de paneles, capturas e informes.</span></button>
        <button class="btn btn-outline" style="margin-top:18px" onclick="backToLogin()">Volver al login</button>
      </div>
    </section>

    <section id="campoModule" class="screen hidden">
      <button class="back-btn" onclick="backFromModule()" title="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <iframe id="campoFrame" class="module-frame" title="PAULET Campo"></iframe>
    </section>

    <section id="fotovoltaicoModule" class="screen hidden">
      <button class="back-btn" onclick="backFromModule()" title="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <iframe id="fotovoltaicoFrame" class="module-frame" title="Fotovoltaico"></iframe>
    </section>
  </main>

      if (!password) return setError('Ingresa tu contraseña.');
      var user = usuarios.find(function(item) {
        return (item.dni === identifier || item.correo.toLowerCase() === identifier) && item.password === password;
